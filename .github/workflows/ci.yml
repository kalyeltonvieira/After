name: CI
# Use the committed Bun lockfile so dependency installation is reproducible.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          if ! bun install --frozen-lockfile; then
            echo "::warning::bun.lock is out of sync with package.json. Regenerate and commit the lockfile to restore fully reproducible installs."
            bun install --no-save
          fi
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
